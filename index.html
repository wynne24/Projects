<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Learning Tracker</title>
    <i data="lucide"></i>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    
    <main>
      <div class="title">
        <div class="page-name">
          <h1>Learning Tracker</h1>
          <i data-lucide="sprout" class="icon"></i>
        </div>
        <div class="total-study">
          <!-- Generate by JS
          <p><strong>Total study time: </strong>4.5 hours</p> 
          -->
        </div>
      </div>
      
      <div class="main-container">
        <div class="element">
          <form class="container-small" id="goal-form">
            <h2>Add a goal</h2>

            <label for="goal-name">Goal name:</label>
            <input id="goal-name" type="text">

            <label for="target-hours">Target hours:</label>
            <input id="target-hours" type="number">

            <button type="submit">Add</button>
          </form>
          
          <form class="container-small" id="session-form">
            <h2>Log a session</h2>
            <label for="goal">Goal:</label>
            <select name="goal" id="goal" class="js-session-name">
              <!-- Generate by JS 
              <option value="LearnTypeScript">Learn TypeScript</option>
              <option value="LearnReact">Learn React</option>
              -->
            </select>

            <label for="goal-duration">Duration:</label>
            <div class="duration-time">
              <input type="number" class="js-duration-input">
              <select name="time" id="time" class="time">
                <option value="hrs">hrs</option>
                <option value="min">min</option>
              </select>
            </div>
            <button type="submit">Add session</button>
          </form>
        </div>

        <div class="container">
          <h2>My goals</h2>
          <div class="goal-list">
            <!--  Generate by JS
            <p class="goal-name"><strong>Learn JavaScript: </strong> 4.5 / 20 hours</p>
            <div class="progress-bar-contianer">
              <div class="progress-bar"></div>
            </div>
            -->
          </div>
        </div>

        <div class="container">
          <h2>Recent sessions</h2>
          <div class="search">
            <div class="search-bar">
              <input class="search-input" type="text">
              <button class="del-search">
                <i data-lucide="x"></i>
              </button>
            </div>
            <button class="search-btn">Search</button>
          </div>
          

          <div class="recent-session">
            <div class="recent-log">
              <button class="delete-btn"><i data-lucide="x"></i></button>
              <p>Learn TypeScript</p>
              <p>50 hours 🥳</p>
              <p>20 May - 31 Aug</p>
            </div>

            <div class="recent-log">
              <button class="delete-btn"><i data-lucide="x"></i></button>
              <p>Practice English</p>
              <p>30 hours 🤯</p>
              <p>20 May - 24 Aug</p>
            </div>
          </div>
        </div>

        
      </div>
    </main>

    <!-- Lucide Icons External Library -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>

    <script type="module" src="script.js"></script>

    <!-- DayJS External Library -->
    <script src="https://unpkg.com/dayjs@1.11.10/dayjs.min.js"></script>

  </body>
</html>
