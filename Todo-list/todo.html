<!DOCTYPE html>
<html>
  <head>
    <title>Todo-list</title>
    <link rel="stylesheet" href="todo.css">
  </head>
  <body>
    <div class="container">
      <p class="title">Todo List</p>

      <div class="todo-grid">
        <input class="js-name-input" type="text" placeholder="Todo Name">
        <input class="js-date-input" type="date">
        <button class="js-add-btn add-btn">Add</button>

        <div class="js-todo-list todo-list"></div>
      </div>
    </div>
    <script src="todo.js"></script>
  </body>
</html>
